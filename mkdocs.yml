site_name: Trafficgram Docs
site_description: Документация проекта Trafficgram
site_author: Yaroslav Gladkyi
repo_url: https://github.com/IUDA194/mk-docs-config
repo_name: IUDA194/mk-docs-config

theme:
  name: material
  language: ru
  logo: https://iudalab.cloud/logo.svg
  favicon: https://iudalab.cloud/logo.svg

  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

  features:
    - navigation.sections     # дерево папками
    - navigation.expand       # раскрытые секции
    - navigation.indexes      # index.md как главная страницы папки
    - navigation.tracking
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html

# ====== СТРУКТУРА МЕНЮ (ПАПКИ) ======
nav:
  - Главная: index.md

  - Accounts service:
      - Overview: accounts/index.md
      - Methods:
          - accounts.get: accounts/accounts.get.md
          - accounts.lock: accounts/accounts.lock.md
          - accounts.release: accounts/accounts.release.md
      - Upload:
          - accounts.upload.batch: accounts/accounts.upload.batch.md
          - accounts.upload.single: accounts/accounts.upload.single.md

  - DevOps:
      - Docker: devops/docker.md
      - CI/CD: devops/cicd.md

  - Infrastructure:
      - Kubernetes: infra/kubernetes.md
      - Monitoring: infra/monitoring.md
