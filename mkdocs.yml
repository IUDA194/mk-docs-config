site_name: Trafficgram Docs
site_description: Документация проекта Trafficgram
site_author: Yaroslav Gladkyi
repo_url: https://github.com/IUDA194/mk-docs-config
repo_name: IUDA194/mk-docs-config

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/favicon.png

  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html

nav:
  - Главная: index.md
  - Backend:
      - Архитектура: backend/architecture.md
      - API: backend/api.md
  - DevOps:
      - Docker: devops/docker.md
      - CI/CD: devops/cicd.md
