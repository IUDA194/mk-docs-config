site_name: Trafficgram Docs
site_description: Документация проекта Trafficgram
site_author: Yaroslav Gladkyi
repo_url: https://github.com/IUDA194/mk-docs-config
repo_name: IUDA194/mk-docs-config

theme:
  name: material
  language: ru
  logo: https://iudalab.cloud/logo.svg
  favicon: https://iudalab.cloud/logo.svg

  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

# ====== МЕНЮ ======
nav:
  - Главная: README.md

  - Accounts Service:
      - Overview: accounts-service/index.md
      - Methods:
          - accounts.get: accounts-service/accounts.get.md
          - accounts.lock: accounts-service/accounts.lock.md
          - accounts.release: accounts-service/accounts.release.md
      - Upload:
          - accounts.upload.batch: accounts-service/accounts.upload.batch.md
          - accounts.upload.single: accounts-service/accounts.upload.single.md
